# Mutation spec for enrol_conditional - run with:
#   mdl mutate moodle-enrol_conditional moodle-enrol_conditional/mutations/gates.conf --fast
#
# Each gate breaks ONE guard and names, under it, the tests that must go red because of it. A gate
# with no "->" line is a guard no test holds today: the sweep reports what (if anything) reddens, and
# an empty result is the finding. A pattern that matches nothing is a hard error.
#
#     tag | file relative to the repo | perl script relative to this file

